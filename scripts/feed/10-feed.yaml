name:     "Public Feed source pool"
schedule: daily
producer: fetch_sources.py --config scripts/feed/10-feed.yaml --records {{RECORDS}} {{WEEKLY_FLAG}}
step:     fetch
ingest:   pool

# step: fetch — this job produces a bundle and stops. No prompt, no model call,
# no output file, nothing published. run-job.sh refuses a fetch config that
# declares prompt: or output:, because declaring them implies a publish this
# step will never perform.
#
# `--config` and not `--topic`, and this file names itself. `--topic feed`
# resolved to scripts/topics/feed.yaml, which is where this config used to live;
# moving it here left that producer line pointing at nothing and the nightly
# pool fetch failed the next morning. A config outside scripts/topics/ has to
# name its own path, exactly as 20-edition.yaml names this one, so that moving
# the file breaks the string instead of silently emptying the tier map.
#
# ingest: pool — the record sidecar is folded into scripts/feed-state/ and
# committed. Still nothing published: the pool is a memory of what has been
# seen, and it has to start accumulating before selection has anything real to
# be tested against. {{RECORDS}} is defined by run-job.sh, not here, so the path
# the producer writes and the path the ingest reads cannot drift apart.
#
# It exists to answer one question with measurement instead of opinion: can a
# source pool sustain seven high-quality public items a day, seven days a week?
# Today's four topics cannot — the qualifying pool is roughly a 1.5:1 selection
# ratio, which is publish-almost-everything. So the bundle accumulates in
# scripts/logs/fetched-<date>-feed.txt for a week and then gets measured.
#
# Deliberately a separate config rather than widening ai.yaml and
# leadership.yaml. The public feed and the private digest want different things
# from the same fetch layer, and the moment the feed's needs start editing the
# digest's sources, the digest starts paying for a product it is not part of.
# The ~15 sources duplicated with ai.yaml are the price of that separation and
# are cheaper than a shared-include mechanism.
#
# Every feed below was probed live on 2026-08-08 and returned parseable entries
# with usable summaries. Feeds that answered 200 with zero-length summaries were
# rejected rather than included hopefully — the public card *is* the summary, so
# a source that never supplies one can never produce a card.
#
# `substance: title-only` is the one exception to that, and it must be asked for
# per source. It stands down the summary-length gate — feed_pool.MIN_SUMMARY at
# admission and feed_select.MIN_SUMMARY_SELECT at selection — for records from
# that source alone, on the grounds that its feed carries titles by design
# rather than by accident. Nothing else is stood down: the blocklist, url safety
# and the ledger apply unchanged, and an exempt item still has to earn a card
# body from the house voice, which fetches the article and writes it. If that
# fails, feed_edition.card_rung drops the item to the title rung, where
# MAX_TITLE_ONLY caps how many bare headlines one edition may carry.
#
# The value is compared for exact equality, so a misspelling leaves the gate on.
# Do not add it to Hacker News or Lobsters: their summary field is field
# furniture ("Article URL: … Points: N"), which is a different problem from
# having no summary, and it is the problem the gate was built for.
#
# max_items is a per-source cap, and the low numbers are deliberate: 54% of
# everything this pipeline has ever published came from vendor-owned domains,
# and an uncapped pool would reproduce that concentration at greater volume.

sources:
  tier1:
    # Robotics and embodied AI — 1.1% of the existing corpus, effectively absent
    - name: "IEEE Spectrum Robotics"
      kind: rss
      url: "https://spectrum.ieee.org/feeds/topic/robotics.rss"
      max_items: 5
    - name: "The Robot Report"
      kind: rss
      url: "https://www.therobotreport.com/feed/"
      max_items: 4
    - name: "TechCrunch Robotics"
      kind: rss
      url: "https://techcrunch.com/category/robotics/feed/"
      max_items: 4

    # Engineering org, developer experience, platform — each under 0.5% today
    - name: "Engineering Enablement"
      kind: rss
      url: "https://newsletter.getdx.com/feed"
      max_items: 4
    - name: "Platform Engineering"
      kind: rss
      url: "https://platformengineering.org/blog/rss.xml"
      max_items: 4
    - name: "The New Stack"
      kind: rss
      url: "https://thenewstack.io/blog/feed/"
      max_items: 5
    - name: "InfoQ Culture & Methods"
      kind: rss
      url: "https://feed.infoq.com/culture-methods/"
      max_items: 4
    - name: "Dev Interrupted"
      kind: rss
      url: "https://devinterrupted.substack.com/feed"
      max_items: 3
    - name: "Stack Overflow Blog"
      kind: rss
      url: "https://stackoverflow.blog/feed/"
      max_items: 4
    - name: "Martin Fowler"
      kind: rss
      url: "https://martinfowler.com/feed.atom"
      max_items: 3
    - name: "Pragmatic Engineer Blog"
      kind: rss
      url: "https://blog.pragmaticengineer.com/rss/"
      max_items: 3

  tier2:
    # AI readiness, adoption, talent — thin today and almost entirely vendor-sourced
    - name: "MIT Sloan Management Review"
      kind: rss
      url: "https://sloanreview.mit.edu/feed/"
      max_items: 4
    - name: "CIO Dive"
      kind: rss
      url: "https://www.ciodive.com/feeds/news/"
      max_items: 4
    - name: "InfoQ AI/ML"
      kind: rss
      url: "https://feed.infoq.com/ai-ml-data-eng/"
      max_items: 4
    - name: "HR Dive"
      kind: rss
      url: "https://www.hrdive.com/feeds/news/"
      max_items: 3
    - name: "TechCrunch Layoffs"
      kind: rss
      url: "https://techcrunch.com/tag/layoffs/feed/"
      max_items: 3
    # Capped hard at 3: measured as marketing-heavy, and it publishes enough to
    # dominate a day's pool on volume alone.
    - name: "McKinsey Insights"
      kind: rss
      url: "https://www.mckinsey.com/insights/rss"
      max_items: 3

    # Non-vendor AI press — the direct counterweight to the 54% vendor share
    - name: "The Register AI"
      kind: rss
      url: "https://www.theregister.com/software/ai_ml/headlines.atom"
      max_items: 5
    - name: "The Verge AI"
      kind: rss
      url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
      max_items: 4
    # SemiAnalysis and The Gradient were probed, added, then removed the same
    # day: both answer 200 with parseable entries, but their newest posts were
    # 11 and 6 months old. A feed that parses is not a feed that publishes.
    - name: "MIT Technology Review AI"
      kind: rss
      url: "https://www.technologyreview.com/topic/artificial-intelligence/feed"
      max_items: 4
    - name: "Last Week in AI"
      kind: rss
      url: "https://lastweekin.ai/feed"
      max_items: 3
    - name: "Wired AI"
      kind: rss
      url: "https://www.wired.com/feed/tag/ai/latest/rss"
      max_items: 3

    # The AI engineering stack — the layer between a model and a product.
    # Absent from this pool entirely: it carries model news and it carries
    # engineering-org writing, and nothing about how the two get connected.
    #
    # Every one of these is a vendor writing about its own product, which is
    # the concentration this file exists to resist, so admission was narrow on
    # purpose. Only sources that write engineering essays rather than release
    # notes are here — the release feeds that fill the same gap in
    # scripts/topics/ai.yaml are deliberately NOT here, because their notes run
    # under the 120-character selection floor and would sit in the pool as
    # candidates that can never be chosen.
    #
    # Median summary length, probed live 2026-08-10: Arize 277, Zep 212,
    # Together 165, Zyte 163, Weaviate 147. All clear MIN_SUMMARY_SELECT with
    # room, which is the measurement that mattered — a source that cannot clear
    # it is a fetch that buys nothing.
    #
    # Capped at 2 each, and the final veto does the rest: FINAL_PER_SOURCE is 1
    # and FINAL_PER_DOMAIN is 2, so these five can contribute at most five of
    # any day's seven, and in practice far fewer. The cap is what makes adding
    # vendor sources to a vendor-wary pool a bounded decision rather than a
    # reversal of one.
    - name: "Arize Blog"
      kind: rss
      url: "https://arize.com/blog/feed/"
      max_items: 2
    - name: "Zep Blog"
      kind: rss
      url: "https://blog.getzep.com/rss/"
      max_items: 2
    - name: "Together AI Blog"
      kind: rss
      url: "https://www.together.ai/blog/rss.xml"
      max_items: 2
    - name: "Zyte Blog"
      kind: rss
      url: "https://www.zyte.com/blog/feed/"
      max_items: 2
    - name: "Weaviate Blog"
      kind: rss
      url: "https://weaviate.io/blog/rss.xml"
      max_items: 2

    # Titles-only by design: probed 2026-08-09, 100 entries, median summary 19
    # characters, roughly 9.5 posts a month. Tier 2 and not tier 3 because tier 3
    # provably never reaches the shortlist — on the live 61-item pool, tier 1 and
    # tier 2 filled all 20 slots and tier 3 contributed none — so an exemption
    # granted at tier 3 would publish nothing.
    - name: "Google Research"
      kind: rss
      url: "https://research.google/blog/rss/"
      max_items: 3
      substance: title-only

    # The pool's only primary artifact, and its only content class with no
    # press-quotation exposure — a maintainer's repository description is not
    # press output, so admitting these lowers the corpus's verbatim-press share
    # rather than raising it. Novelty 46%, third-highest of any measured source.
    #
    # `kind: github_repos`, deliberately NOT `kind: github`. `github` is the
    # private digest's kind and shares its fetcher with scripts/topics/ai.yaml;
    # this one has its own, so feed work cannot alter what the digest reads.
    # It also screens every candidate against the GitHub REST API — age, forks,
    # archived, stars, last push, a real description — because the reviewer
    # approves a title and a description without opening the repository, which
    # makes the automated gate load-bearing rather than supplementary.
    #
    # Tier 2 and not tier 3, for the reason stated above for Google Research:
    # on the live 61-item pool, tiers 1 and 2 filled all 20 shortlist slots and
    # tier 3 contributed none, so a source added at tier 3 publishes nothing.
    #
    # max_items caps the *candidate* list, before enrichment — 15 candidates is
    # 15 unauthenticated API calls against a 60/hour budget. Measured supply is
    # ~1.17 repositories a night after the floors, and FINAL_PER_SOURCE = 1 caps
    # the edition at one regardless, so a larger number buys quota use and
    # nothing else.
    #
    # No `substance:` line here on purpose. The fetcher stamps `substance: repo`
    # onto each record from the API response it verified, so the title-length
    # exemption is earned by screening rather than granted by config.
    - name: "GitHub Trending"
      kind: github_repos
      url: "https://github.com/trending"
      max_items: 15
      # Exposure to the judge, not admission to the page. The global
      # SHORTLIST_PER_SOURCE of 2 is calibrated for a publisher, where two
      # articles a day is a fair sample of what it filed. This source admits
      # 1-3 repositories a night, so a cap of 2 is not a sample — it is most of
      # the supply, chosen by the id hash that breaks a same-day rank tie.
      # On 2026-08-22 that forwarded two repositories reading as marketing and
      # cut the third, whose description named a protocol and a concrete
      # alternative; the judge declined both it was shown.
      #
      # FINAL_PER_SOURCE still caps this source at ONE published card, and
      # `veto` takes no override, so this widens what the model may choose from
      # and cannot widen what reaches a reader.
      #
      # THREE, not four, and the difference is not a preference. Every
      # repository shares one domain, so SHORTLIST_PER_DOMAIN = 3 binds before
      # any source cap above 3 and a larger number here would be a config line
      # that cannot take effect — measured on 2026-08-23, when 19 repositories
      # were eligible and a declared 4 still yielded 3. Going higher means
      # deciding about the domain cap, which §4 of the GitHub proposal records
      # as arguable (github.com is a host, not a publication) and which is a
      # separate decision from this one.
      shortlist_per_source: 3

  tier3:
    # Engineering blogs. Vendor-adjacent, so capped at 2 each: useful for
    # depth, dangerous for concentration.
    - name: "NVIDIA Blog"
      kind: rss
      url: "https://blogs.nvidia.com/feed/"
      max_items: 2
    - name: "Microsoft Research"
      kind: rss
      url: "https://www.microsoft.com/en-us/research/feed/"
      max_items: 2
    - name: "Meta Engineering"
      kind: rss
      url: "https://engineering.fb.com/feed/"
      max_items: 2
    - name: "GitHub Engineering"
      kind: rss
      url: "https://github.blog/engineering/feed/"
      max_items: 2
    - name: "Cloudflare Blog"
      kind: rss
      url: "https://blog.cloudflare.com/rss/"
      max_items: 2
    - name: "Netflix TechBlog"
      kind: rss
      url: "https://netflixtechblog.com/feed"
      max_items: 2
    - name: "Sourcegraph Blog"
      kind: rss
      url: "https://sourcegraph.com/blog/rss.xml"
      max_items: 2
    - name: "CNCF"
      kind: rss
      url: "https://www.cncf.io/feed/"
      max_items: 2
    # 2,714 entries in the feed. The cap is not a preference, it is a defence.
    - name: "Thoughtworks Insights"
      kind: rss
      url: "https://www.thoughtworks.com/rss/insights.xml"
      max_items: 2

    # Discovery. **The claim that used to sit here — "unlike hnrss.org/frontpage,
    # both carry real summaries" — was wrong, and it was measured wrong.** Neither
    # carries a summary at all. Hacker News fills the field with
    # `Article URL: … Comments URL: … Points: N # Comments: M`, which cleared the
    # pool's 80-character bar on the length of two urls alone; Lobsters uses the
    # single word "Comments". Four HN items were sitting in the pool as
    # publishable candidates before sanitise_summary exposed them.
    #
    # Kept, not removed, and the distinction matters: their *titles* are good
    # discovery signal, and whether a title alone can carry a card is exactly
    # what E8's fallback ladder decides. Until then these two contribute nothing
    # and cost one fetch each. Drop them if E8 rules out title-only cards.
    - name: "Lobsters"
      kind: rss
      url: "https://lobste.rs/rss"
      max_items: 5
    - name: "Hacker News (100+ points)"
      kind: rss
      url: "https://hnrss.org/best?points=100"
      max_items: 5
