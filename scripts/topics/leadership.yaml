name:     "Engineering Leadership"
schedule: saturday
producer: fetch_sources.py --topic leadership {{WEEKLY_FLAG}}
prompt:   scripts/prompts/leadership.md
output:   src/content/leadership/{{DATE}}.md

sources:
  tier1:
    - name: "LeadDev"
      kind: rss
      url: "https://leaddev.com/feed/"
      max_items: 8
    - name: "Will Larson"
      kind: rss
      url: "https://lethain.com/feeds.xml"
      max_items: 5
    - name: "Charity Majors"
      kind: rss
      url: "https://charity.wtf/feed/"
      max_items: 5

  tier2:
    - name: "Rands in Repose"
      kind: rss
      url: "https://randsinrepose.com/feed/"
      max_items: 5
    - name: "Level Up"
      kind: html
      url: "https://levelup.patkua.com"
      max_items: 5
    - name: "Camille Fournier"
      kind: rss
      url: "https://medium.com/feed/@skamille"
      max_items: 5
    - name: "The Pragmatic Engineer"
      kind: rss
      url: "https://newsletter.pragmaticengineer.com/feed"
      max_items: 5
    - name: "Lara Hogan"
      kind: rss
      url: "https://larahogan.me/feed.xml"
      max_items: 5

  tier3:
    - name: "Hacker News"
      kind: rss
      url: "https://hnrss.org/frontpage"
      max_items: 30
      filter_regex: "\\b(engineering.?manager|EM\\b|1:1|staff.?meeting|team.?lead|agentic|SDLC|sprint|retro\\b|retrospective|hiring|performance.?review|org.?design|skip.?level|platform.?engineering|tech.?lead|people.?manager|management)\\b"
      filter_cap: 3
    - name: "r/ExperiencedDevs"
      kind: rss
      url: "https://www.reddit.com/r/ExperiencedDevs.rss"
      max_items: 10
    - name: "r/Engineering_Manager"
      kind: rss
      url: "https://www.reddit.com/r/Engineering_Manager.rss"
      max_items: 10
