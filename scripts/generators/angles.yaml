# Weekly Angles — the Sunday generation run.
#
# The first job in scripts/generators/, and the whole runtime of Epic 4: this
# config, scripts/prompts/posts/angles.md, and scripts/studio/select_corpus.py.
# It reads the ranked corpus bundle built from the digest archive, the field
# notes and the watchlist signal, and produces 6–10 candidate angles for the
# week that just ended. A human picks 2–3 and drafts them.
#
# Sunday, because Saturday's `leadership` weekly synthesis then has a full day
# to be read and starred before this consumes it — the stars are the ranking
# signal, and an unread synthesis carries none.
#
# `producer:` is resolved relative to scripts/ — run-job.sh invokes it as
# `"$PYTHON_BIN" scripts/$PRODUCER`. `--date {{DATE}}` is not decoration:
# select_corpus.py defaults to Date.today(), so without it a bundle replayed on
# any later day would select a different window than the run it belongs to.
#
# `output:` names the ISO week, not the day, so the artifact is the week's and a
# second run on the same Sunday skips on the existing file. ISO year (%G), never
# the calendar year — 2027-01-01 is 2026-W53.
#
# `never` stays in job_scheduled_today()'s vocabulary. It is the honest way to
# park a config that must exist for its settings before its runtime does, which
# is exactly what this file was between Epic 3 and Epic 4.
name:     "Weekly Angles"
schedule: sunday
producer: studio/select_corpus.py --job angles --date {{DATE}}
prompt:   scripts/prompts/posts/angles.md
output:   $STUDIO_DIR/angles/{{WEEK}}.md
model:    claude-opus-5
schema:   angles

selection:
  lookback_days: 14
  collections: [leadership, ai, tech, rva-events]
  half_life_days: 7
  weights:
    # leadership is weighted 3x against ai's 1x to offset a ~6:1 raw count
    # imbalance (42 ai digests against 7 leadership today), so the anchor topic
    # leads the bundle despite being outnumbered. Expect to retune over Q1 as
    # leadership accumulates at ~4/month.
    theme:   { leadership: 3.0, ai: 1.0, tech: 0.6, rva-events: 0.1 }
    # Applied once per digest, not once per starred item — see rank() in
    # scripts/studio/select_corpus.py for why.
    starred: 1.5
    noted:   2.0
    done:    0.3
