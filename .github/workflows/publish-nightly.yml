# NOTE: This workflow is the legacy Cowork-based publish path.
# The automated pipeline (generate-digest.yml) now handles everything end-to-end.
# This file is only needed if manually committing content to the content-staging branch.
name: Nightly content publish

on:
  schedule:
    # 11:59 PM EDT (UTC-4) Mon–Sat ET
    - cron: '59 3 * * 2-7'
    # 11:59 PM EST (UTC-5) Mon–Sat ET — both entries run year-round;
    # the "new files" check below prevents double-publishing on the same night.
    - cron: '59 4 * * 2-7'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for unmerged content on staging branch
        id: check
        run: |
          git fetch origin content-staging 2>/dev/null || { echo "new_files=0" >> "$GITHUB_OUTPUT"; exit 0; }
          COUNT=$(git diff main..origin/content-staging --name-only -- 'src/content/' 2>/dev/null | wc -l | tr -d ' ')
          echo "new_files=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Unmerged content files: $COUNT"

      - name: Copy new content files from staging to main
        if: steps.check.outputs.new_files != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Copy only content/ files — avoids picking up any other staging changes
          git checkout origin/content-staging -- src/content/
          git commit -m "chore: nightly content publish $(date -u +%Y-%m-%d)"
          git push origin main
          echo "Published $(date -u +%Y-%m-%d) content to main."

      - name: No new content — skip
        if: steps.check.outputs.new_files == '0'
        run: echo "No new content files on content-staging. Nothing to publish tonight."
